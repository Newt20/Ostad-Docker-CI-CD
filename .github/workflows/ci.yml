name: Build, Test, and Deploy

on:
  push:
    branches: [ Development ]

jobs:
  setup-and-build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install UI dependencies
        working-directory: ./OstadUI
        run: npm install

      - name: Build frontend
        working-directory: ./OstadUI
        run: npm run build

      - name: Run frontend tests
        working-directory: ./OstadUI
        run: echo "No tests"

      - name: Deploy to EC2
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem
          scp -i key.pem -r ./OstadUI/dist $USER@$HOST:/var/www/html/
          ssh -i key.pem $USER@$HOST "sudo chown -R www-data:www-data /var/www/html && sudo systemctl restart nginx"

      - name: Show success message
        run: echo "✅ Build and deploy complete"
